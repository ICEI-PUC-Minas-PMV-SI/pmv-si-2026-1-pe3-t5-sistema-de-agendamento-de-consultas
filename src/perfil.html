<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGACO - Perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="components/sidebar/sidebar.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/perfil.css">
</head>

<body>
    <div class="app-layout">
        <div id="sidebar-container"></div>

        <main class="dashboard-wrapper">
            <div class="dashboard-card-container">

                <header class="dashboard-header">
                    <div>
                        <h1 class="dashboard-title">Perfil</h1>
                        <p class="section-subtitle">Gerencie suas informações pessoais e preferências.</p>
                    </div>
                    <div class="header-controls">
                        <div class="user-profile">
                            <span class="user-badge" id="logged-user">Administrador: Pedro Campos</span>
                        </div>
                    </div>
                </header>

             
                <div class="perfil-grid">

                
                    <div class="perfil-col-left">
                        <div class="perfil-avatar-card">
                            <div class="perfil-avatar-wrapper">
                                <div class="perfil-avatar" id="perfil-avatar-initials">PC</div>
                                <div class="perfil-avatar-overlay" id="perfil-avatar-change" title="Alterar foto">
                                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                                        <circle cx="12" cy="13" r="4"/>
                                    </svg>
                                </div>
                            </div>
                            <div class="perfil-info-basic">
                                <div class="perfil-field">
                                    <label class="perfil-label" for="input-nome">Nome</label>
                                    <input type="text" id="input-nome" class="perfil-input" value="Pedro Campos" readonly>
                                </div>
                                <div class="perfil-field">
                                    <label class="perfil-label" for="input-email">E-mail</label>
                                    <input type="email" id="input-email" class="perfil-input" value="pedro.campos@odontoflow.com" readonly>
                                </div>
                                <div class="perfil-field">
                                    <label class="perfil-label" for="input-perfil">Perfil</label>
                                    <input type="text" id="input-perfil" class="perfil-input" value="Administrador" readonly>
                                </div>
                                <div class="perfil-info-actions">
                                    <button class="btn btn-outline" id="btn-edit-info" type="button">Editar Informações</button>
                                    <button class="btn btn-primary" id="btn-save-info" type="button" style="display:none;">Salvar</button>
                                    <button class="btn btn-cancel" id="btn-cancel-info" type="button" style="display:none;">Cancelar</button>
                                </div>
                                <span id="info-feedback" class="perfil-feedback"></span>
                            </div>
                        </div>
                    </div>

                 
                    <div class="perfil-col-center">
                        <div class="perfil-section-card">
                            <h2 class="perfil-section-title">Alterar Senha</h2>
                            <form id="form-senha" class="perfil-form" autocomplete="off">
                                <div class="perfil-field">
                                    <label class="perfil-label" for="senha-atual">Senha Atual</label>
                                    <div class="perfil-input-wrapper">
                                        <input type="password" id="senha-atual" class="perfil-input" placeholder="Digite sua senha atual">
                                        <button type="button" class="perfil-eye-btn" data-target="senha-atual" tabindex="-1" aria-label="Mostrar senha">
                                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                                <circle cx="12" cy="12" r="3"/>
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                                <div class="perfil-field">
                                    <label class="perfil-label" for="senha-nova">Nova Senha</label>
                                    <div class="perfil-input-wrapper">
                                        <input type="password" id="senha-nova" class="perfil-input" placeholder="Mínimo 6 caracteres">
                                        <button type="button" class="perfil-eye-btn" data-target="senha-nova" tabindex="-1" aria-label="Mostrar senha">
                                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                                <circle cx="12" cy="12" r="3"/>
                                            </svg>
                                        </button>
                                    </div>
                                    <div class="perfil-strength" id="senha-strength" style="display:none;">
                                        <div class="strength-bar">
                                            <div class="strength-fill" id="strength-fill"></div>
                                        </div>
                                        <span class="strength-label" id="strength-label"></span>
                                    </div>
                                </div>
                                <div class="perfil-field">
                                    <label class="perfil-label" for="senha-confirmar">Confirmar Nova Senha</label>
                                    <div class="perfil-input-wrapper">
                                        <input type="password" id="senha-confirmar" class="perfil-input" placeholder="Repita a nova senha">
                                        <button type="button" class="perfil-eye-btn" data-target="senha-confirmar" tabindex="-1" aria-label="Mostrar senha">
                                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                                <circle cx="12" cy="12" r="3"/>
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                                <div class="perfil-form-actions">
                                    <button type="submit" class="btn btn-primary btn-full">Salvar Nova Senha</button>
                                    <span id="senha-feedback" class="perfil-feedback"></span>
                                </div>
                            </form>
                        </div>
                    </div>

                 
                    <div class="perfil-col-right">
                        <div class="perfil-section-card">
                            <h2 class="perfil-section-title">Preferências</h2>
                            <div class="perfil-preferences">
                                <div class="pref-item">
                                    <div class="pref-item-left">
                                        <div class="pref-check" id="check-notificacoes">
                                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2.5">
                                                <polyline points="2,6 5,9 10,3"/>
                                            </svg>
                                        </div>
                                        <span class="pref-label">Receber notificações</span>
                                    </div>
                                    <div class="pref-toggle active" id="toggle-notificacoes" data-pref="notificacoes" role="switch" aria-checked="true" tabindex="0">
                                        <div class="toggle-thumb"></div>
                                    </div>
                                </div>
                                <div class="pref-item">
                                    <div class="pref-item-left">
                                        <div class="pref-check" id="check-relatorios">
                                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2.5">
                                                <polyline points="2,6 5,9 10,3"/>
                                            </svg>
                                        </div>
                                        <span class="pref-label">Receber relatórios</span>
                                    </div>
                                    <div class="pref-toggle active" id="toggle-relatorios" data-pref="relatorios" role="switch" aria-checked="true" tabindex="0">
                                        <div class="toggle-thumb"></div>
                                    </div>
                                </div>
                                <div class="pref-item">
                                    <div class="pref-item-left">
                                        <div class="pref-check" id="check-novidades">
                                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2.5">
                                                <polyline points="2,6 5,9 10,3"/>
                                            </svg>
                                        </div>
                                        <span class="pref-label">Notificações de Novidades</span>
                                    </div>
                                    <div class="pref-toggle active" id="toggle-novidades" data-pref="novidades" role="switch" aria-checked="true" tabindex="0">
                                        <div class="toggle-thumb"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="perfil-sair-card">
                            <button class="btn btn-sair" id="btn-sair" type="button">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                                    <polyline points="16 17 21 12 16 7"/>
                                    <line x1="21" y1="12" x2="9" y2="12"/>
                                </svg>
                                SAIR
                            </button>
                        </div>
                    </div>

                </div>
             

            </div>
        </main>
    </div>

  
    <div id="modal-sair" class="perfil-modal" style="display:none;">
        <div class="perfil-modal-backdrop"></div>
        <div class="perfil-modal-content">
            <h3>Confirmar saída</h3>
            <p>Tem certeza que deseja sair do sistema?</p>
            <div class="perfil-modal-actions">
                <button class="btn btn-primary" id="modal-sair-confirm">Sim, sair</button>
                <button class="btn btn-outline" id="modal-sair-cancel">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="components/sidebar/sidebar.js"></script>
    <script src="js/perfil.js"></script>
</body>

</html>
