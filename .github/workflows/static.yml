# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ---- SOLUÇÃO DO JAVASCRIPT CORRIGIDA AQUI ----
      - name: Prepare staging directory
        run: |
          # 1. Cria a pasta temporária de deploy
          mkdir _site
          
          # 2. Copia TODO o conteúdo da sua pasta 'src' para dentro de '_site'
          # Isso garante que subpastas como js/, css/, assets/ continuem existindo lá dentro
          cp -r src/* _site/
          
          # 3. Transforma o dashboard.html no index.html principal na raiz do deploy
          cp src/dashboard.html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Faz o upload da pasta estruturada com HTML, JS e CSS
          path: '_site'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
